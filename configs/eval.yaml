# Evaluation protocol. Frozen BEFORE looking at results; changes must be justified in the paper.

snapshot: nse_v1
models: [naive, arima, prophet, prophet_anchored, xgboost]
benchmark_model: naive            # every model is judged against this
horizons: [1, 5, 21]              # trading days ahead

# Second task: volatility forecasting (a task where candidates CAN beat the benchmark, so the gate
# is shown to promote as well as reject). Same protocol, loss = normalised QLIKE.
volatility:
  models: [hist_vol, ewma, garch, har]
  benchmark_model: hist_vol
  horizons: [5, 21]

min_train_rows: 756               # ~3 years before the first origin
origin_step: 10                   # trading days between forecast origins (grid anchored at min_train_rows-1)

# DEV period: model development / any tuning / drift-policy design. Outcomes must be realised
# strictly BEFORE holdout_start (purged), so no dev result touches holdout data.
# FINAL HOLDOUT: origins on/after holdout_start. Run ONCE (a lock file prevents re-runs).
holdout_start: "2024-01-01"

results_dir: results

stats:
  alpha: 0.05
  bootstrap_resamples: 2000
  bootstrap_seed: 0
